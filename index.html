  <script>
  (() => {
    "use strict";

    // 1. Constants and configuration
    const STORAGE_KEY = "kff-control-evaluation-v1";
    const controlDefinition = {
      id:"AP-EXP-001",name:"고액 비용 사전 승인",version:"3.2",threshold:10000000,effectiveFrom:"2026-01-01",
      requiredDocuments:["PAYMENT_VOUCHER","APPROVAL_DOCUMENT"],

    const FIELD_META={
      expenseAmount:["지급금액","expense.amount","PAYMENT_VOUCHER","payment-amount"],
      paymentDate:["지급일","expense.payment_date","PAYMENT_VOUCHER","payment-date"],

      financeApprovalStatus:["재무담당 임원 승인 여부","finance_executive.approval_status","APPROVAL_DOCUMENT","finance-status"],
      financeApprovalDate:["재무담당 임원 승인일","finance_executive.approval_date","APPROVAL_DOCUMENT","finance-date"]
    };
    const RESULT_TEXT={PASS:"통제 충족",FAIL:"통제 미충족",REVIEW:"추가 검토 필요","N/A":"평가 대상 아님"};
    const FIELD_STATUS={EXTRACTED:"확인",REQUIRED_DOCUMENT_MISSING:"증빙 미제출",EVIDENCE_ABSENT:"필수 항목 없음",EXTRACTION_UNCERTAIN:"확인 필요",CONFLICT:"증빙 불일치",INVALID:"형식 오류",NOT_APPLICABLE:"적용 대상 아님"};
    const STATUS_FILTERS=["전체","미평가","평가 완료","추가 검토","증빙 보완","적용 제외"];
    const MENUS=["대시보드","운영평가","증빙검토","예외사항","조서관리","통제기준","시스템 이력"];

    // 2. Mock business data
    const rawSamples=[
      {id:"EXP-24001",date:"2026-06-12",amount:25000000,department:"구매팀",vendor:"한빛솔루션",purpose:"구매시스템 유지보수비",paymentDate:"2026-06-15",dhDate:"2026-06-10",finDate:"2026-06-12",status:"평가 완료",result:"PASS",analyzed:true,finalized:true},
      {id:"EXP-24002",date:"2026-06-15",amount:32000000,department:"영업기획팀",vendor:"세림컨설팅",purpose:"영업전략 자문 용역비",paymentDate:"2026-06-15",dhDate:"2026-06-12",finDate:"2026-06-17",status:"미평가",result:null,analyzed:false},
      {id:"EXP-24003",date:"2026-06-18",amount:18000000,department:"마케팅팀",vendor:"에이원미디어",purpose:"브랜드 캠페인 집행비",paymentDate:"2026-06-18",dhDate:"2026-06-13",finDate:null,actualFinDate:"2026-06-16",status:"추가 검토 필요",result:"REVIEW",analyzed:true},
      {id:"EXP-24004",date:"2026-06-20",amount:8000000,department:"IT운영팀",vendor:"디지털웍스",purpose:"전산장비 정기점검비",paymentDate:"2026-06-20",dhDate:null,finDate:null,status:"적용 제외",result:"N/A",analyzed:true},
      {id:"EXP-24005",date:"2026-06-24",amount:20000000,department:"총무팀",vendor:"미래오피스",purpose:"사무환경 개선비",paymentDate:"2026-06-24",dhDate:null,finDate:null,status:"증빙 보완",result:"REVIEW",analyzed:true,missingApproval:true},
      {id:"EXP-24006",date:"2026-06-27",amount:14000000,department:"재무팀",vendor:"한국리서치서비스",purpose:"시장조사 용역비",paymentDate:"2026-06-27",dhDate:"2026-06-25",finDate:null,status:"미평가",result:null,analyzed:false,financeMissing:true}

    // 3. Application state
    const createFields=(s)=>controlDefinition.requiredFields.map(id=>{
      let value,status="EXTRACTED";
      if(id==="expenseAmount") value=s.amount;

      if(id==="departmentHeadApprovalDate") value=s.dhDate;

      if(id==="financeApprovalDate") value=s.finDate;
      if(s.amount<controlDefinition.threshold && id.includes("Approval")) status="NOT_APPLICABLE";
      else if(s.missingApproval && id.includes("Approval")) status="REQUIRED_DOCUMENT_MISSING";
      else if(s.financeMissing && (id==="financeApprovalStatus"||id==="financeApprovalDate")) status="EVIDENCE_ABSENT";
      else if(s.id==="EXP-24003"&&id==="financeApprovalDate"){status="EXTRACTION_UNCERTAIN";value="2026-06-1?";}
      const unavailable=["REQUIRED_DOCUMENT_MISSING","EVIDENCE_ABSENT","NOT_APPLICABLE"].includes(status);
      return {id,label:FIELD_META[id][0],internalId:FIELD_META[id][1],value,status,source:{documentType:FIELD_META[id][2],fileName:unavailable?null:(FIELD_META[id][2]==="PAYMENT_VOUCHER"?"payment_voucher_":"approval_document_")+s.id+".pdf",page:unavailable?null:1,text:value==null?"확인 불가":String(value),anchorId:unavailable?null:FIELD_META[id][3]},verifiedByUser:false};
    });
    const initialState=()=>({
      activeMenu:"운영평가",selectedId:"EXP-24002",filter:"전체",search:"",showFieldIds:false,previewTab:"PAYMENT_VOUCHER",highlight:null,
      samples:Object.fromEntries(rawSamples.map(s=>[s.id,{...s,fields:createFields(s),review:s.result==="FAIL"?"통제 미충족 사항에 대한 개선조치가 필요함.":s.result==="REVIEW"?"필수 승인 문서 또는 승인일을 확인할 수 없어 추가 검토가 필요함.":"",followUp:"후속조치 없음",importance:"중간",events:s.id==="EXP-24001"?[
        {time:"2026.07.08 10:12:00",title:"증빙 분석 완료"},{time:"2026.07.08 10:15:00",title:"운영평가 실행",detail:"결과: 통제 충족"},{time:"2026.07.08 10:20:00",title:"평가 결과 확정"}
      ]:[],evaluation:null,evaluatedAt:s.id==="EXP-24001"?"2026.07.08 10:15:00":null,tempFiles:[],requestInfo:null,reopenHistory:[]}]))
    });
    let state=loadState()||initialState();
    let processing={analysis:false,evaluation:false,steps:[],active:0};

    // 4. Utility functions
    const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    const won=n=>new Intl.NumberFormat("ko-KR").format(Number(n||0))+"원";
    const dateDot=v=>v&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v.replaceAll("-","."):v||"-";
    const toDateOnly=value=>{if(!value||!value.includes("-"))return null;const [y,m,d]=value.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));};
    const nowText=()=>{
      const parts=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date()).map(p=>[p.type,p.value]));
      return `${parts.year}.${parts.month}.${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
    };
    const systemDateText=()=>nowText().slice(0,10);
    const futureDateISO=(days=5)=>{const d=new Date();d.setDate(d.getDate()+days);return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);};
    const current=()=>state.samples[state.selectedId];
    const resultClass=r=>r==="PASS"?"pass":r==="FAIL"?"fail":r==="REVIEW"?"review":"na";
    const resultSymbol=r=>r==="PASS"?"✓":r==="FAIL"?"!":r==="REVIEW"?"?":"—";
    const addEvent=(s,title,detail="")=>{s.events.unshift({time:nowText(),title,detail});saveState();};
    function toast(title,detail="업무 상태가 정상적으로 반영되었습니다."){const el=document.createElement("div");el.className="toast";el.innerHTML=`<b>${e(title)}</b><span>${e(detail)}</span>`;document.querySelector("#toastZone").append(el);setTimeout(()=>el.remove(),3600);}
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    const setModal=html=>{document.querySelector("#modalRoot").innerHTML=html;document.body.style.overflow="hidden";setTimeout(()=>document.querySelector(".modal button, .modal input")?.focus(),0);};
    const closeModal=()=>{document.querySelector("#modalRoot").innerHTML="";document.body.style.overflow="";};
    function statusBadge(s){
      const cls=s.status==="평가 완료"?"pass":s.status==="증빙 보완"||s.status.includes("검토")?"review":s.status==="적용 제외"?"na":"neutral";
      return `<span class="badge ${cls}">${s.status==="평가 완료"?"✓":s.status==="증빙 보완"?"!":s.status.includes("검토")?"?":"•"} ${e(s.status)}</span>`;
    }
    const evaluationBadge=r=>r?`<span class="badge ${resultClass(r)}">${resultSymbol(r)} ${RESULT_TEXT[r]}</span>`:`<span class="badge neutral">— 미실행</span>`;
    function defaultReview(ev){
      const byReason={
        ALL_REQUIRED_APPROVALS_COMPLETED:"부서장과 재무담당 임원의 승인이 모두 지급 전에 완료되어 통제 충족으로 판단함.",

        DEPARTMENT_HEAD_APPROVAL_NOT_BEFORE_PAYMENT:"부서장 승인이 지급 전에 완료되지 않아 통제 미충족으로 판단함.",
        DEPARTMENT_HEAD_APPROVAL_MISSING:"부서장 승인 기록이 확인되지 않아 통제 미충족으로 판단함.",
        FINANCE_EXECUTIVE_APPROVAL_MISSING:"재무담당 임원 승인 기록이 확인되지 않아 통제 미충족으로 판단함.",
        REQUIRED_APPROVAL_DOCUMENT_MISSING:"필수 전자결재 승인 문서가 제출되지 않아 증빙 보완이 필요함.",
        REQUIRED_FIELD_UNCERTAIN:"필수 승인일을 확인할 수 없어 원본 확인 및 추가 검토가 필요함.",

        BELOW_APPROVAL_THRESHOLD:"지급금액이 통제 적용 기준 미만으로 평가 대상에서 제외함."
      };
      return byReason[ev?.reasonCode]||ev?.summary||"평가 결과에 대한 담당자 검토가 필요함.";
    }
    function workpaperNarrative(s,ev){
      const dh=dateDot(s.fields.find(f=>f.id==="departmentHeadApprovalDate")?.value),fin=dateDot(s.fields.find(f=>f.id==="financeApprovalDate")?.value),pay=dateDot(s.paymentDate);
      const byReason={
        ALL_REQUIRED_APPROVALS_COMPLETED:`지급금액 ${won(s.amount)}의 거래에 대해 부서장 승인일 ${dh} 및 재무담당 임원 승인일 ${fin}이 모두 지급일 ${pay} 전에 완료된 것으로 확인되었습니다.`,
        FINANCE_APPROVAL_NOT_BEFORE_PAYMENT:`지급금액 ${won(s.amount)}의 거래에 대해 부서장 승인은 지급 전에 완료되었으나, 재무담당 임원 승인은 지급일 ${pay} 이후인 ${fin}에 완료된 것으로 확인되었습니다.`,
        DEPARTMENT_HEAD_APPROVAL_NOT_BEFORE_PAYMENT:`부서장 승인일 ${dh}이 지급일 ${pay} 이전이 아닌 것으로 확인되어 통제 미충족으로 평가하였습니다.`,
        DEPARTMENT_HEAD_APPROVAL_MISSING:"부서장 승인 기록이 제출 증빙에서 확인되지 않아 통제 미충족으로 평가하였습니다.",
        FINANCE_EXECUTIVE_APPROVAL_MISSING:"재무담당 임원 승인 기록이 제출 증빙에서 확인되지 않아 통제 미충족으로 평가하였습니다.",
        REQUIRED_APPROVAL_DOCUMENT_MISSING:"필수 전자결재 승인 문서가 제출되지 않아 운영평가를 확정하지 못하였으며 증빙 보완이 필요합니다.",

    // 5. Rendering functions
    function render(){
      document.querySelector("#app").innerHTML=`
        <div class="app">
          <aside class="sidebar">
            <div class="brand"><strong>AI 통제 운영평가<br>시스템</strong><small>내부회계관리제도 통제 운영평가</small></div>

    function renderEvaluationPage(){
      const samples=Object.values(state.samples), completed=samples.filter(s=>s.status==="평가 완료"||s.status==="적용 제외").length;
      const review=samples.filter(s=>s.status.includes("검토")).length,evidence=samples.filter(s=>s.status==="증빙 보완").length,unassessed=samples.filter(s=>s.status==="미평가").length;

    function renderSamplePanel(){

    function docRow(d){return `<div class="doc-row"><span class="doc-icon">PDF</span><div><b>${d.type}</b><small>${e(d.file)} · 1페이지</small></div><span class="badge pass">✓ 제출 완료</span></div>`;}
    function renderSteps(steps,active,cls){return `<div class="${cls}" role="status">${steps.map((x,i)=>`<div class="step ${i<active?"done":i===active?"active":""}"><span>${i<active?"✓":i===active?'<i class="spinner"></i>':"○"}</span>${x}</div>`).join("")}</div>`;}
    function renderFields(s){
      if(!s.analyzed)return `<section class="card"><div class="section-head"><h3>필수 평가 항목</h3></div><div class="section-body"><div class="empty-state">제출된 증빙을 분석하면 통제 평가에 필요한 항목을 확인할 수 있습니다.</div></div></section>`;

    function fieldStatusBadge(st){const text=FIELD_STATUS[st]||st,cls=st==="EXTRACTED"?"pass":st==="NOT_APPLICABLE"?"na":st==="EXTRACTION_UNCERTAIN"?"review":st.includes("MISSING")||st==="EVIDENCE_ABSENT"?"fail":"review";return `<span class="badge ${cls}">${cls==="pass"?"✓":cls==="na"?"—":"!"} ${text}</span>`;}
    function renderValidation(s){

    function evidenceValidation(fields,documentStatus){

      const conflict=fields.find(f=>f.status==="CONFLICT");if(conflict)return {valid:false,reason:"EVIDENCE_CONFLICT"};

      const tab=ev.target.closest("[data-tab]")?.dataset.tab;if(tab){state.previewTab=tab;state.highlight=null;render();return;}
      const field=ev.target.closest("[data-field]")?.dataset.field;if(field&&!ev.target.closest("[data-action='verify-field']")){focusEvidence(field);return;}
      const condition=ev.target.closest("[data-condition]");if(condition){const c=current().evaluation?.conditions.find(x=>x.id===condition.dataset.condition);if(c?.fieldId)focusEvidence(c.fieldId);return;}
      const action=ev.target.closest("[data-action]")?.dataset.action;if(!action)return;
      try{
        if(action==="show-control")showControlModal();
        if(action==="close-modal")closeModal();
        if(action==="export-list")exportSampleList();
        if(action==="add-evidence")document.querySelector("#fileInput").click();
        if(action==="open-original"){state.previewTab=current().missingApproval?"PAYMENT_VOUCHER":state.previewTab;document.querySelector(".paper")?.scrollIntoView({behavior:"smooth",block:"center"});}
        if(action==="analyze")await analyzeEvidence();
        if(action==="evaluate")await evaluateSample();
        if(action==="toggle-field-ids"){state.showFieldIds=!state.showFieldIds;render();}
        if(action==="verify-field")showVerifyModal();
        if(action==="apply-verification")applyVerification();
        if(action==="request-evidence")showEvidenceRequestModal();
        if(action==="confirm-evidence-request")confirmEvidenceRequest();
        if(action==="save-review")saveReview();
        if(action==="request-review")showReviewRequestModal();
        if(action==="confirm-review-request")confirmReviewRequest();
        if(action==="finalize")showFinalizeModal();
        if(action==="confirm-finalize")finalizeEvaluation();
        if(action==="reopen")showReopenModal();
        if(action==="confirm-reopen")confirmReopen();
        if(action==="workpaper")workpaperModal();
        if(action==="print")window.print();
        if(action==="export-word")toast("조서 초안이 내보내기 대기 목록에 등록되었습니다.");
        if(action==="show-detail")showDetailModal();
        if(action==="reset-data")showResetModal();
        if(action==="confirm-reset"){localStorage.removeItem(STORAGE_KEY);state=initialState();normalizeState();closeModal();render();toast("평가 데이터가 초기 상태로 복원되었습니다.");}
        if(action==="logout")toast("로그아웃은 보안 정책에 따라 별도 인증 화면에서 처리됩니다.");
      }catch(err){toast("요청을 처리하지 못했습니다.","화면을 유지한 상태에서 다시 시도해 주세요.");}
    });
    document.addEventListener("input",ev=>{if(ev.target.id==="search"){state.search=ev.target.value;const pos=ev.target.selectionStart;render();const input=document.querySelector("#search");input.focus();input.setSelectionRange(pos,pos);}});
    document.addEventListener("change",ev=>{
      if(ev.target.id==="fileInput"){const s=current();s.tempFiles.push(...[...ev.target.files].map(f=>f.name));saveState();render();toast("선택한 파일이 임시 증빙에 추가되었습니다.","파일은 외부로 전송되지 않습니다.");}
    });
    document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&document.querySelector(".modal-layer"))closeModal();if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches(".sample"))ev.target.click();});
    function focusEvidence(fieldId){
      const f=current().fields.find(x=>x.id===fieldId);if(!f?.source?.anchorId)return;state.previewTab=f.source.documentType;state.highlight=f.source.anchorId;render();setTimeout(()=>document.querySelector("#"+f.source.anchorId)?.scrollIntoView({behavior:"smooth",block:"center"}),50);
    }
    function showControlModal(){setModal(`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">통제 기준</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body"><div class="modal-section"><h3>통제 목적</h3><p>고액 비용 지급에 대한 적절한 사전 승인을 확보하여<br>무단 또는 부적절한 비용 집행 위험을 방지한다.</p></div><div class="modal-section"><h3>적용 조건</h3><p>지급금액이 10,000,000원 이상인 거래</p></div><div class="modal-section"><h3>필수 조건</h3><ol class="rule-list"><li>부서장 승인이 존재해야 한다.</li><li>재무담당 임원 승인이 존재해야 한다.</li><li>두 승인 모두 지급일 전에 완료되어야 한다.</li></ol></div><div class="modal-section"><h3>인정 증빙</h3><p>지급 전표 · 전자결재 승인 문서</p></div><div class="modal-section"><h3>규칙 버전 / 적용 기간</h3><p>AP-EXP-001 v3.2 · 2026.01.01부터</p></div></div><div class="modal-foot"><button class="btn primary" data-action="close-modal">확인</button></div></div></div>`);}
    function showVerifyModal(){const s=current();if(s.id!=="EXP-24003"){toast("수동 확인 대상이 아닙니다.","확인 필요 상태의 필드에서 사용할 수 있습니다.");return;}setModal(`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal large"><div class="modal-head"><h2 id="modalTitle">재무담당 임원 승인일 확인</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body"><div class="zoom-doc"><div class="zoom-paper"><p>비용 지급 승인서 · 재무담당 임원 결재란</p><hr><p>재무담당 임원 승인 &nbsp; <b>승인</b></p><p>원문 표시: 승인일 <span class="zoom-value">2026.06.16</span></p></div></div><div class="form-grid" style="margin-top:16px"><div class="field"><label for="verifyDate">확인값</label><input id="verifyDate" type="date" value="2026-06-16"></div><div class="field"><label for="verifyReason">수정 사유</label><select id="verifyReason"><option>원본 문서 직접 확인</option><option>증빙 제출자 확인</option></select></div></div><p style="color:var(--gray-600);font-size:10px">이 확인값은 현재 표본에만 반영되며 다른 표본에는 자동 적용되지 않습니다.</p></div><div class="modal-foot"><button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="apply-verification">확인값 반영</button></div></div></div>`);}
    function applyVerification(){const s=current(),value=document.querySelector("#verifyDate").value,reason=document.querySelector("#verifyReason").value;if(!value)return;const f=s.fields.find(x=>x.id==="financeApprovalDate");f.value=value;f.status="EXTRACTED";f.verifiedByUser=true;f.source.text="승인일 "+value;s.finDate=value;s.status="증빙 분석 완료";s.evaluation=null;s.result=null;addEvent(s,"재무담당 임원 승인일 수정",`기존 값: 확인 불가 / 수정 값: ${dateDot(value)} / 수정 사유: ${reason} / 수정자: 내부통제팀 김민지`);saveState();closeModal();render();toast("확인값이 반영되었습니다.","담당자 확인 이력이 저장되었습니다.");}
    function showEvidenceRequestModal(){const s=current();setModal(`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">증빙 보완 요청</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label for="requestTarget">요청 대상</label><input id="requestTarget" value="${e(s.department)} 비용 담당자"></div><div class="field"><label for="requestDue">보완 기한</label><input id="requestDue" type="date" value="${futureDateISO()}"></div><div class="field full"><label for="requestReason">요청 사유</label><textarea id="requestReason">고액 비용 사전 승인 통제 평가에 필요한 전자결재 승인 문서를 제출해 주세요.</textarea></div></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="confirm-evidence-request">보완 요청 등록</button></div></div></div>`);}
    function confirmEvidenceRequest(){const s=current(),target=document.querySelector("#requestTarget").value.trim(),due=document.querySelector("#requestDue").value,reason=document.querySelector("#requestReason").value.trim();if(!target||!due||!reason){toast("필수 항목을 입력해 주세요.","요청 대상, 보완 기한 및 요청 사유가 필요합니다.");return;}s.requestInfo={type:"증빙 보완",target,due,reason,requestedAt:nowText(),requester:"내부통제팀 김민지"};s.status="증빙 보완";addEvent(s,"증빙 보완 요청",`요청 대상: ${target} / 보완 기한: ${dateDot(due)} / 요청 사유: ${reason}`);saveState();closeModal();render();toast("증빙 보완 요청이 등록되었습니다.",`${target} · ${dateDot(due)}까지`);}
    function showReviewRequestModal(){const s=current();captureReview();setModal(`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">재검토 요청</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label for="reviewer">재검토자</label><select id="reviewer"><option>통제 책임자 박준호</option><option>내부통제팀 이서연</option></select></div><div class="field full"><label for="reviewRequestNote">요청 의견</label><textarea id="reviewRequestNote">판정 근거 및 후속조치의 적정성을 재검토해 주세요.</textarea></div></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="confirm-review-request">재검토 요청 등록</button></div></div></div>`);}
    function confirmReviewRequest(){const s=current(),reviewer=document.querySelector("#reviewer").value,note=document.querySelector("#reviewRequestNote").value.trim();if(!note){toast("요청 의견을 입력해 주세요.");return;}s.requestInfo={type:"재검토",target:reviewer,reason:note,requestedAt:nowText(),requester:"내부통제팀 김민지"};s.status="재검토 요청";addEvent(s,"재검토 요청",`재검토자: ${reviewer} / 요청 의견: ${note}`);saveState();closeModal();render();toast("재검토 요청이 등록되었습니다.",reviewer);}
    function showReopenModal(){setModal(`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">평가 재개</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body"><p>확정된 평가를 다시 편집 가능한 상태로 전환합니다. 기존 확정 결과와 변경 이력은 보존됩니다.</p><div class="field" style="margin-top:14px"><label for="reopenReason">재개 사유</label><textarea id="reopenReason" placeholder="재개 사유를 구체적으로 입력해 주세요."></textarea></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">취소</button><button class="btn danger" data-action="confirm-reopen">평가 재개</button></div></div></div>`);}
    function confirmReopen(){const s=current(),reason=document.querySelector("#reopenReason").value.trim();if(!reason){toast("재개 사유를 입력해 주세요.");return;}s.reopenHistory=s.reopenHistory||[];s.reopenHistory.push({reason,reopenedAt:nowText(),reopenedBy:"내부통제팀 김민지",previousResult:s.result,previousFinalizedAt:s.finalizedAt});s.finalized=false;s.status="담당자 검토 중";addEvent(s,"평가 재개",`재개 사유: ${reason} / 재개자: 내부통제팀 김민지`);saveState();closeModal();render();toast("평가가 다시 편집 가능한 상태로 전환되었습니다.");}
    function captureReview(){const s=current();s.review=document.querySelector("#review")?.value.trim()||s.review||"";s.followUp=document.querySelector("#followUp")?.value||s.followUp;s.importance=document.querySelector("#importance")?.value||s.importance;}
    function saveReview(showToast=true){const s=current();captureReview();s.status=s.status==="운영평가 완료"?"담당자 검토 중":s.status;addEvent(s,"평가자 의견 저장");saveState();render();if(showToast)toast("평가 결과가 임시 저장되었습니다.");}
    function showFinalizeModal(){const s=current();captureReview();if(!s.evaluation||s.evaluation.result==="REVIEW"){toast("평가 결과를 확정할 수 없습니다.","추가 검토 또는 증빙 보완 사항을 먼저 해소해 주세요.");return;}if(!s.review){toast("평가자 의견을 입력해 주세요.","의견 입력 후 평가를 완료할 수 있습니다.");return;}if(s.evaluation.result==="FAIL"&&s.followUp==="후속조치 없음"){toast("후속조치를 선택해 주세요.","통제 미충족 건은 후속조치 지정 후 확정할 수 있습니다.");return;}setModal(`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">평가 결과 확정</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body"><h3>평가 결과를 확정하시겠습니까?</h3><div class="paper-grid" style="margin-top:16px"><dt>표본번호</dt><dd>${s.id}</dd><dt>평가 결과</dt><dd>${RESULT_TEXT[s.evaluation.result]}</dd><dt>후속조치</dt><dd>${e(s.followUp)}</dd></div><p style="margin-top:16px;color:var(--gray-600)">확정된 결과는 조서에 반영됩니다.</p></div><div class="modal-foot"><button class="btn" data-action="close-modal">취소</button><button class="btn primary" data-action="confirm-finalize">평가 결과 확정</button></div></div></div>`);}
    function finalizeEvaluation(){const s=current();s.finalized=true;s.status=s.result==="N/A"?"적용 제외":"평가 완료";s.finalizedBy="내부통제팀 김민지";s.finalizedAt=nowText();addEvent(s,"평가 결과 확정",`평가자: ${s.finalizedBy}`);saveState();closeModal();render();toast("평가 결과가 확정되었습니다.");}
    function showDetailModal(){const s=current(),ev=s.evaluation;if(!ev){toast("상세 판정 근거가 없습니다.","운영평가를 먼저 실행해 주세요.");return;}setModal(`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal large"><div class="modal-head"><h2 id="modalTitle">상세 판정 근거</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body"><div class="table-wrap"><table class="field-table"><thead><tr><th>조건</th><th>입력값 / 설명</th><th>결과</th><th>사용 필드</th><th>문서 출처</th></tr></thead><tbody>${ev.conditions.map(c=>{const f=s.fields.find(x=>x.id===c.fieldId);return `<tr><td>${c.label}</td><td>${e(c.description)}</td><td>${conditionBadge(c.status)}</td><td>${e(f?.internalId||"-")}</td><td>${e(f?.source.fileName||"-")}</td></tr>`}).join("")}</tbody></table></div><div class="run-grid" style="margin-top:16px"><div class="kv"><span>사유코드</span><b>${ev.reasonCode}</b></div><div class="kv"><span>통제 기준</span><b>AP-EXP-001 v3.2</b></div><div class="kv"><span>문서 분석</span><b>Document AI v2.1</b></div><div class="kv"><span>판정 엔진</span><b>Control Engine v1.0</b></div></div><details><summary>구조화 데이터 보기</summary><pre style="white-space:pre-wrap;background:var(--gray-50);padding:12px">${e(JSON.stringify(ev,null,2))}</pre></details></div><div class="modal-foot"><button class="btn primary" data-action="close-modal">닫기</button></div></div></div>`);}
    function showResetModal(){setModal(`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">평가 데이터 초기화</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body"><h3>저장된 평가 데이터를 초기 상태로 복원하시겠습니까?</h3><p>분석 결과, 담당자 의견, 확정 상태 및 실행 이력이 삭제됩니다.</p></div><div class="modal-foot"><button class="btn" data-action="close-modal">취소</button><button class="btn danger" data-action="confirm-reset">평가 데이터 초기화</button></div></div></div>`);}
    function exportSampleList(){const rows=[["표본번호","거래처","담당부서","지급금액","상태","평가결과"],...Object.values(state.samples).map(s=>[s.id,s.vendor,s.department,s.amount,s.status,RESULT_TEXT[s.evaluation?.result||s.result]||"미실행"])];const blob=new Blob(["\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="2026_Q2_운영평가_표본목록.csv";a.click();URL.revokeObjectURL(a.href);toast("표본 목록을 내보냈습니다.");}

    // 11. Persistence
    function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(_){toast("저장 공간을 사용할 수 없습니다.","현재 화면에서는 계속 업무를 진행할 수 있습니다.");}}
    function loadState(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY));return data?.samples&&data?.selectedId?data:null;}catch(_){return null;}}
    function normalizeState(){
      const seededTimes={"EXP-24001":"2026.07.08 10:15:00","EXP-24003":"2026.07.08 11:31:00","EXP-24004":"2026.07.08 13:05:00","EXP-24005":"2026.07.08 14:10:00"};
      Object.values(state.samples).forEach(s=>{
        s.events=Array.isArray(s.events)?s.events:[];s.tempFiles=Array.isArray(s.tempFiles)?s.tempFiles:[];s.reopenHistory=Array.isArray(s.reopenHistory)?s.reopenHistory:[];
        s.fields=(s.fields?.length?s.fields:createFields(s)).map(f=>{
          if(["REQUIRED_DOCUMENT_MISSING","EVIDENCE_ABSENT","NOT_APPLICABLE"].includes(f.status)){f.source={...f.source,fileName:null,page:null,anchorId:null};}
          return f;
        });
        if(s.result&&s.analyzed&&!s.evaluation){
          s.evaluation=controlEngine({control:controlDefinition,evidenceFields:s.fields,documentStatus:{paymentVoucher:!s.missingVoucher,approvalDocument:!s.missingApproval}});
          s.result=s.evaluation.result;s.evaluatedAt=s.evaluatedAt||seededTimes[s.id]||nowText();
          if(!s.events.some(x=>x.title==="운영평가 실행"))s.events.push({time:s.evaluatedAt,title:"운영평가 실행",detail:`결과: ${RESULT_TEXT[s.result]}`});
        }
      });
      saveState();
    }

    // 12. Application initialization
    normalizeState();
    const App={get state(){return state;},init:render,render,selectSample:id=>{state.selectedId=id;render();},analyzeEvidence,evaluateSample,saveReview,finalizeEvaluation};
    window.ControlEvaluationApp=App;
    render();
  })();
  </script>
</body>
